version: '3.8'

services:
  backend:
    image: php:8.4-fpm
    container_name: real_estate_backend
    working_dir: /var/www/html/backend
    volumes:
      - ./backend:/var/www/html/backend
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/backend/database/database.sqlite

  frontend:
    image: node:20
    container_name: real_estate_frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm start -- --host 0.0.0.0"